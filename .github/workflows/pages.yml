
name: Deploy Kaprekar Privacy Policy

on:
  push:
    branches: [main]
    paths:
      - 'index.md'
      - '_config.yml'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare privacy policy
        run: |
          mkdir -p _site
          cp index.md _site/index.md

          cat > _site/_config.yml <<'EOF'
          title: Kaprekar Challenge
          description: Adatvédelmi tájékoztató
          theme: jekyll-theme-cayman
          markdown: kramdown
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site
          destination: ./_site_built

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site_built

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
